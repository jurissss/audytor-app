name: audytor_app
description: Mobilna aplikacja do wykonywania audytów technicznych i generowania raportów PDF.
publish_to: 'none'
version: 0.6.0+6

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2+1
  path_provider: ^2.1.6
  path: ^1.9.1
  image_picker: ^1.2.3
  intl: ^0.20.3
  pdf: ^3.12.0
  printing: ^5.14.3
  image: ^4.3.0
  archive: ^3.6.1
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  cross_file: ^0.3.4+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
