name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack application
        run: unzip -o audytor_app_mvp.zip

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter --version

      - name: Create Android project files
        working-directory: audytor_app
        run: flutter create --platforms=android .

      - name: Force Android compileSdk 36
        working-directory: audytor_app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path(".")

          # Main application.
          for rel in [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]:
              if not rel.exists():
                  continue

              text = rel.read_text(encoding="utf-8")
              text = text.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36",
              )
              text = text.replace(
                  "compileSdkVersion flutter.compileSdkVersion",
                  "compileSdkVersion 36",
              )
              rel.write_text(text, encoding="utf-8")
              print(f"Patched application file: {rel}")

          # Global override for all Android subprojects/plugins.
          settings = Path("android/settings.gradle.kts")
          if settings.exists():
              print("Kotlin DSL Android project detected")
          else:
              print("Android project detected")

          root_gradle = Path("android/build.gradle.kts")
          if root_gradle.exists():
              text = root_gradle.read_text(encoding="utf-8")
              marker = "// FORCE_COMPILE_SDK_36"
              if marker not in text:
                  text += r'''

          // FORCE_COMPILE_SDK_36
          subprojects {
              afterEvaluate {
                  if (project.hasProperty("android")) {
                      extensions.configure<com.android.build.gradle.BaseExtension> {
                          compileSdkVersion(36)
                      }
                  }
              }
          }
          '''
                  root_gradle.write_text(text, encoding="utf-8")
                  print(f"Added global SDK override to: {root_gradle}")
          else:
              root_gradle = Path("android/build.gradle")
              if root_gradle.exists():
                  text = root_gradle.read_text(encoding="utf-8")
                  marker = "// FORCE_COMPILE_SDK_36"
                  if marker not in text:
                      text += r'''

          // FORCE_COMPILE_SDK_36
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          '''
                      root_gradle.write_text(text, encoding="utf-8")
                      print(f"Added global SDK override to: {root_gradle}")
          PY

          echo "=== Application compileSdk ==="
          grep -R -n "compileSdk" android/app/build.gradle* || true

          echo "=== Global SDK override ==="
          grep -R -n "FORCE_COMPILE_SDK_36\|compileSdkVersion(36)\|compileSdkVersion 36" android/build.gradle* || true

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        working-directory: audytor_app
        run: flutter pub get

      - name: Build APK
        working-directory: audytor_app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Audytor-Android
          path: audytor_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
