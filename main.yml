name: Audytor Android - SDK36

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Ensure Android project exists
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Force compileSdk 36
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = list(Path("android").rglob("build.gradle"))
          files += list(Path("android").rglob("build.gradle.kts"))

          cache = Path.home() / ".pub-cache"
          if cache.exists():
              files += list(cache.rglob("android/build.gradle"))
              files += list(cache.rglob("android/build.gradle.kts"))

          for p in files:
              try:
                  s = p.read_text(encoding="utf-8")
              except Exception:
                  continue

              old = s
              s = s.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36",
              )
              s = s.replace(
                  "compileSdkVersion flutter.compileSdkVersion",
                  "compileSdkVersion 36",
              )
              s = re.sub(
                  r"compileSdkVersion\s+[0-9]+",
                  "compileSdkVersion 36",
                  s,
              )
              s = re.sub(
                  r"compileSdk\s*=\s*[0-9]+",
                  "compileSdk = 36",
                  s,
              )

              if s != old:
                  p.write_text(s, encoding="utf-8")
                  print("Patched:", p)
          PY

          echo "=== APP compileSdk ==="
          grep -R -n "compileSdk" android/app/build.gradle* || true

          echo "=== file_picker compileSdk ==="
          find ~/.pub-cache -path "*file_picker*/android/build.gradle*"             -type f -print -exec grep -n "compileSdk" {} \; || true

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Audytor-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
