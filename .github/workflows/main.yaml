name: Audytor Android - SDK36

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Locate Android SDK and install SDK 36
        shell: bash
        run: |
          set -e

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""

          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/12.0/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -perm -111 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Create Android project if missing
        shell: bash
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android .
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Force compileSdk 36 everywhere
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = []

          files += list(Path("android").rglob("build.gradle"))
          files += list(Path("android").rglob("build.gradle.kts"))

          cache = Path.home() / ".pub-cache"

          if cache.exists():
              files += list(cache.rglob("android/build.gradle"))
              files += list(cache.rglob("android/build.gradle.kts"))

          for p in files:
              try:
                  s = p.read_text(encoding="utf-8")
              except Exception:
                  continue

              old = s

              # Kotlin DSL / Flutter
              s = s.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36"
              )

              # Groovy / Flutter
              s = s.replace(
                  "compileSdkVersion flutter.compileSdkVersion",
                  "compileSdkVersion 36"
              )

              # Groovy: compileSdkVersion 34
              s = re.sub(
                  r"\bcompileSdkVersion\s+[0-9]+\b",
                  "compileSdkVersion 36",
                  s
              )

              # Kotlin DSL: compileSdk = 34
              s = re.sub(
                  r"\bcompileSdk\s*=\s*[0-9]+\b",
                  "compileSdk = 36",
                  s
              )

              # Groovy: compileSdk 34
              s = re.sub(
                  r"\bcompileSdk\s+[0-9]+\b",
                  "compileSdk 36",
                  s
              )

              if s != old:
                  p.write_text(s, encoding="utf-8")
                  print("PATCHED:", p)

          PY

          echo ""
          echo "=============================="
          echo "APPLICATION SDK"
          echo "=============================="
          grep -R -n "compileSdk" android/app/build.gradle* || true

          echo ""
          echo "=============================="
          echo "FILE_PICKER SDK"
          echo "=============================="
          find ~/.pub-cache \
            -path "*file_picker*/android/build.gradle*" \
            -type f \
            -print \
            -exec grep -n "compileSdk" {} \; || true

      - name: Flutter clean
        run: flutter clean

      - name: Restore dependencies
        run: flutter pub get

      - name: Re-apply SDK36 patch after pub get
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache"

          files = []
          files += list(Path("android").rglob("build.gradle"))
          files += list(Path("android").rglob("build.gradle.kts"))

          if cache.exists():
              files += list(cache.rglob("android/build.gradle"))
              files += list(cache.rglob("android/build.gradle.kts"))

          for p in files:
              try:
                  s = p.read_text(encoding="utf-8")
              except Exception:
                  continue

              old = s

              s = s.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36"
              )

              s = s.replace(
                  "compileSdkVersion flutter.compileSdkVersion",
                  "compileSdkVersion 36"
              )

              s = re.sub(
                  r"\bcompileSdkVersion\s+[0-9]+\b",
                  "compileSdkVersion 36",
                  s
              )

              s = re.sub(
                  r"\bcompileSdk\s*=\s*[0-9]+\b",
                  "compileSdk = 36",
                  s
              )

              s = re.sub(
                  r"\bcompileSdk\s+[0-9]+\b",
                  "compileSdk 36",
                  s
              )

              if s != old:
                  p.write_text(s, encoding="utf-8")
                  print("PATCHED AGAIN:", p)

          PY

          echo ""
          echo "=============================="
          echo "FINAL FILE_PICKER SDK"
          echo "=============================="

          find ~/.pub-cache \
            -path "*file_picker*/android/build.gradle*" \
            -type f \
            -print \
            -exec grep -n "compileSdk" {} \; || true

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          echo "=============================="
          echo "APK RESULT"
          echo "=============================="

          ls -lh build/app/outputs/flutter-apk/

          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Audytor-Android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
